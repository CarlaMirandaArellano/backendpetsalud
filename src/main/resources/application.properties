spring.application.name=backendpetsalud

# --- Base de datos (credenciales por variables de entorno, nunca en el repositorio) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petsalud_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
# JWT_SECRET: clave en Base64 de al menos 32 bytes. Generar con: openssl rand -base64 32
jwt.secret=${JWT_SECRET:}
# Vigencia del token en milisegundos (1 hora)
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.issuer=petsalud-backend

# --- Cuenta GERENTE inicial (opcional) ---
app.gerente.email=${GERENTE_EMAIL:}
app.gerente.password=${GERENTE_PASSWORD:}

# --- CORS: orígenes del frontend autorizados (separados por coma) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}
